name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Cancel superseded runs on the same ref to save minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build (typecheck + compile)
        run: npm run build

      - name: Test
        run: npm test

      # Évals de comportement du réceptionniste (prompt + contrat d'outils),
      # jouées contre le vrai modèle. Coût: quelques centimes par run.
      #
      # Sans le secret OPENAI_API_KEY, le harness ne s'exécute pas. Il ne le
      # cache plus: il émet une annotation `::warning::` visible dans la PR, au
      # lieu de sortir en 0 en silence et de laisser croire que la protection
      # anti-régression de prompt a tourné.
      #
      # POUR EN FAIRE UN VRAI GARDE-FOU: configurer le secret sur le dépôt,
      # puis décommenter EVALS_REQUIRE_KEY ci-dessous. L'absence de clé
      # deviendra alors un échec, ce qui est le seul état où une étape verte
      # signifie quelque chose.
      - name: Évals réceptionniste
        run: npm run evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # EVALS_REQUIRE_KEY: '1'

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

  docs:
    name: Docs (miroirs des templates)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # emails/ and sms/ mirror the transactional copy that lives in code.
      # A mirror that has drifted is worse than no mirror, so a change to the
      # templates without a regenerated folder fails here.
      - name: Les miroirs sont à jour
        run: npm run check:templates

  frontend:
    name: Frontend (build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (typecheck + bundle)
        run: npm run build

      - name: Test
        run: npm test

      # Les parcours de bout en bout, sur le bundle qui vient d'être construit.
      # Ils tournent APRÈS le build parce qu'ils servent `dist` par `preview`:
      # c'est le fichier livré qui est testé, pas le serveur de développement,
      # dont le comportement diffère justement sur les points qui cassent
      # (découpage des modules, réécritures de routes, variables d'env).
      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end (Playwright)
        run: npm run e2e

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
