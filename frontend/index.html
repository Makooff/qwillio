    <!-- Le thEME et le FOND, avant tout le reste.
         `bootTheme()` vit dans le paquet JS: jusqu'a son execution la page
         n'avait ni attribut `data-theme` ni couleur de fond, donc un ecran
         vide pendant tout le telechargement. Ces quelques lignes sont
         inlinees exprES: elles ne coutent aucune requete et s'appliquent au
         premier octet. La logique est celle de `stores/themeStore.ts`, y
         compris le mode systEme, qui RETIRE l'attribut pour laisser la
         requete media trancher. -->
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('qwillio.theme');
          if (raw === 'light' || raw === 'dark') document.documentElement.setAttribute('data-theme', raw);
        } catch (e) { /* navigation privee: la requete media decide */ }
      })();
    </script>
    <style>
      /* Les memes valeurs que les tokens `q2-canvas` et `q2-ink`, ecrites ici
         parce que la feuille de styles arrive plus tard. Elles ne font que
         peindre le fond: tout le reste attend le vrai CSS. */
      html { background: #FDFCFC; color: #1D1D1F; }
      html[data-theme="dark"] { background: #0A0A0A; color: #F5F4F2; }
      @media (prefers-color-scheme: dark) {
        html:not([data-theme="light"]) { background: #0A0A0A; color: #F5F4F2; }
      }
      body { margin: 0; background: inherit; }
    </style>

    <!-- ═══ SEO ═══
         Ces balises sont ce que lisent les robots qui n'executent pas le JS.
         `hooks/useSEO` les reecrit ensuite, par page: elles doivent donc dire
         la meme chose que le produit et non ce qu'on esperait du produit.

         Trois corrections, chacune attestee par le code:
         - `lang="fr"`: le site est francophone (DA/voix.md, « francais
           d'abord »), et la page se declarait anglaise.
         - les prix viennent de `pages/v2/pricing-plans.ts` (99/249/599/1290
           EUR). Ils etaient en dollars et ne correspondaient a aucun plan
           existant, donc Google diffusait une grille inventee.
         - `areaServed` se limite a la Belgique et a la France. Les zones
           etrangeres (US, Canada, Royaume-Uni, Australie) n'etaient adossees
           a rien: les numeros sont belges et les tarifs en euros.
         Les affirmations invérifiables (annee de fondation, SLA de 99,5 % des
         le plan Pro, « 2 000 integrations », « 15 minutes ») sont retirees: la
         page /sla dit elle-meme qu'aucune disponibilite n'est garantie hors
         Enterprise, et un balisage ne peut pas promettre l'inverse. -->

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",

    <!-- Schema.org JSON-LD, FAQPage
         Les questions sont celles de `pages/v2/Faq.tsx`, en francais. Le bloc
         precedent etait une traduction anglaise ecrite ici, et il contredisait
         la page sur trois points au moins: l'essai (7 jours, pas « le premier
         mois gratuit »), l'assistance en langues supplementaires, et le prix
         du plan Solo (99 EUR, pas 149). Deux sources pour la meme reponse
         finissent toujours par diverger. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "inLanguage": "fr",
      "mainEntity": [
        {
                "@type": "Question",
                "name": "Est-ce qu'il prend vraiment le rendez-vous pendant l'appel ?",
                "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Oui, si votre agenda Google est connecte. Des qu'un jour est prononce, Qwillio interroge vos disponibilites sans attendre la fin de la phrase, propose les creneaux reellement libres, puis ecrit la reservation confirmee. Deux appels simultanes ne peuvent pas repartir avec le meme creneau. Sans agenda connecte, il note la demande et vos coordonnees."
                }
        },
        {
                "@type": "Question",
                "name": "Que se passe-t-il quand il me passe l'appel ?",
                "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Avant de faire le pont, Qwillio vous resume a l'oral qui est en ligne et pourquoi, puis vous envoie le meme brief par SMS: le nom, le numero, le motif et l'etat d'esprit de l'appelant. Si le transfert saute en route, vous avez deja le numero pour rappeler."
                }
        },
        {
                "@type": "Question",
                "name": "Reconnait-il un client qui rappelle ?",
                "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Oui. Un appelant deja connu est salue par son prenom, et ce qui a ete dit lors du precedent appel est disponible des le decrochage, tout comme son rendez-vous a venir. Cette memoire se limite a ce qui sert l'appel suivant, n'est ni vendue ni utilisee pour entrainer un modele externe sans votre accord, et peut etre effacee sur demande, conformement au RGPD."
                }
        },
        {
                "@type": "Question",
                "name": "Combien ca coute ?",
                "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Le plan Solo est a 99 euros par mois: 250 minutes incluses. Au-dela, les minutes supplementaires sont a 0,45 euro. Les plans superieurs ajoutent du volume et des fonctions avancees: Starter 249 euros (750 minutes), Pro 599 euros (2 000 minutes), Enterprise 1 290 euros (5 000 minutes). Sept jours d'essai gratuit, resiliable au mois, remise de 20 pour cent en annuel."
                }
        },
        {
                "@type": "Question",
                "name": "Puis-je resilier facilement ?",
                "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Oui. Tous les plans sont sans engagement, resilisables au mois en un clic depuis votre tableau de bord. Aucun frais d'installation, aucune periode minimale."
                }
        },
        {
                "@type": "Question",
                "name": "Parle-t-il d'autres langues que le francais et l'anglais ?",
                "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Non. Francais et anglais, et c'est un choix. Les deux fonctionnent sur le meme appel, sans menu a choisir: si l'appelant passe a l'anglais en cours de conversation, Qwillio suit. Deux langues bien tenues valent mieux qu'une longue liste mal tenue."
                }
        },
        {
                "@type": "Question",
                "name": "Les appels spam comptent-ils dans mes minutes ?",
                "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Non, sur tous les plans. Le bouclier anti-spam detecte les robocalls, les appels silencieux et les numeros qui inondent la ligne, les ecarte de vos rendez-vous et de vos prospects, et ne les decompte pas de vos minutes incluses."
                }
        },
        {
                "@type": "Question",
                "name": "Puis-je utiliser ma propre voix ?",
                "acceptedAnswer": {
                        "@type": "Answer",
                        "text": "Oui. Depuis le tableau de bord, enregistrez entre 20 et 90 secondes au micro, ou importez un fichier audio, et la voix clonee est utilisable dans la foulee. Le clonage exige votre consentement explicite, la voix doit etre la votre ou enregistree avec l'accord ecrit de la personne. Vous pouvez la remplacer ou la supprimer a tout moment."
                }
        }
]
    }
    </script>

    <!-- ═══ Fonts ═══ -->
    <!-- Les hôtes de l'appel vocal. La poignée de main (DNS, TLS) se paie
         sinon au moment du clic, sur un réseau mobile où elle coûte le plus
         cher: `api.vapi.ai` crée l'appel, et `daily.co` porte le transport
         WebRTC, dont le bundle n'est chargé qu'à la première salle ouverte.
         Aucun octet n'est téléchargé ici, seulement la connexion préparée. -->
    <link rel="preconnect" href="https://api.vapi.ai" crossorigin="anonymous" />
    <link rel="preconnect" href="https://c.daily.co" crossorigin="anonymous" />
    <link rel="dns-prefetch" href="https://api.vapi.ai" />
    <link rel="dns-prefetch" href="https://c.daily.co" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous" />
    <!-- La feuille Google Fonts BLOQUAIT le rendu. Tant qu'elle n'a pas
         repondu, le navigateur ne peint rien: sur un reseau mobile lent, ou
         quand fonts.googleapis.com est injoignable, la page reste noire
         plusieurs secondes pour une police. Mesure ici: 16,7 s contre 4,2 s.
         `media="print"` la sort du chemin critique, `onload` la remet en jeu
         des qu'elle arrive, et `display=swap` fait que le texte s'affiche
         d'abord dans la police de repli. Le <noscript> couvre le cas sans JS. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" />
    </noscript>
